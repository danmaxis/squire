[project]
name = "squire"
version = "0.1.0"
description = "Orquestrador Claude Code + LLM Local para execução semi-autônoma de projetos"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
squire = "squire:main"

[tool.setuptools]
py-modules = ["squire", "checkpoint", "config", "models", "inner_loop", "backends", "homologator", "rate_limiter"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
